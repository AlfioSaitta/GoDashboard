<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note</title>
</head>
<body>
  <!-- Notes editor window for a single tab. Independent of the Wails runtime:
       talks to Go through the WebKit message handler "dashboardNotes"
       (see tabs_shell.go / notes_bridge.go). The tab id comes from ?tab=<id>. -->
  <div id="app"></div>
  <div id="loading" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-family:monospace;z-index:9999;padding:20px;background:rgba(0,0,0,0.8);border-radius:8px;">Note...</div>
  <script type="module" src="/src/notes/main.js"></script>
</body>
</html>
